name: Manual Build
on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device'
        required: true
        default: 'mt7981'
        type: choice
        options:
          - mt7981
          - mt7986

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Initialization environment
        run: |
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d/*
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Clone source
        run: |
          git clone -b openwrt-24.10-6.6 --single-branch --filter=blob:none \
            https://github.com/padavanonly/immortalwrt-mt798x-24.10 immortalwrt-mt798x-24.10

      - name: Update & Install Feeds
        working-directory: immortalwrt-mt798x-24.10
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy defconfig
        working-directory: immortalwrt-mt798x-24.10
        run: |
          cp -f defconfig/${{ github.event.inputs.device }}-ax3000.config .config

      - name: SSH connection to Actions
        uses: P3TERX/ssh2actions@main

      - name: Compile
        id: compile
        working-directory: immortalwrt-mt798x-24.10
        run: |
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: ImmortalWrt_${{ github.event.inputs.device }}
          path: immortalwrt-mt798x-24.10/bin/targets/
